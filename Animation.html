<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision For Venture - Scroll Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Neue Haas Grotesk', 'Inter', sans-serif;
        }

        :root {
            --mask-size: 70vh;
            /* desktop */
        }

        @media (max-width: 768px) {
            :root {
                --mask-size: 40vh;
                /* smaller on mobile */
            }
        }

        body {
            background-color: #111;
            color: #fff;
            overflow-x: hidden;
        }

        /* ─── Site Header ─── */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            padding: 0 40px;
            min-height: 64px;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            /* starts invisible */
            opacity: 0;
            transform: translateY(-100%);

            /* glass morphism background */
            background: rgba(10, 10, 10, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);

            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .site-header.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Text wordmark — scales with viewport; tighter on small screens */
        .text-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #fff;
            line-height: 1;
            flex-shrink: 0;
            max-width: min(52vw, 220px);
        }

        .text-logo__simon {
            font-family: 'Great Vibes', cursive;
            font-weight: 400;
            font-size: clamp(1.65rem, 1.1rem + 2.4vw, 2.85rem);
            line-height: 0.95;
            letter-spacing: 0.02em;
        }

        .text-logo__says-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45em;
            width: 100%;
            margin-top: 0.12em;
        }

        .text-logo__rule {
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.45);
            min-width: 0.6em;
            max-width: 2.75em;
        }

        .text-logo__says {
            font-family: 'Neue Haas Grotesk', 'Inter', sans-serif;
            font-size: clamp(0.58rem, 0.42rem + 0.55vw, 0.72rem);
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .header-end {
            display: flex;
            align-items: center;
            gap: 28px;
            flex-shrink: 0;
        }

        .header-menu-toggle {
            display: none;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .header-menu-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .header-menu-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* Nav links */
        .header-nav {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
        }

        .header-nav a {
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            transition: color 0.2s ease;
            position: relative;
        }

        .header-nav a::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 1px;
            background: #fff;
            transition: width 0.25s ease;
        }

        .header-nav a:hover {
            color: #fff;
        }

        .header-nav a:hover::after {
            width: 100%;
        }

        /* CTA pill */
        .header-cta {
            display: inline-flex;
            align-items: center;
            padding: 8px 20px;
            background: #fff;
            color: #000;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 100px;
            transition: background 0.25s ease, color 0.25s ease;
        }

        .header-cta:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* ─── Hero Section ─── */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #000 !important;
        }

        /* ─── Text layer — sits BEHIND the video mask ─── */

        .primary-title {
            position: absolute;
            z-index: 3;
            display: flex;
            flex-direction: column;
            font-weight: 800;
            letter-spacing: -2px;
            font-size: clamp(40px, 11vw, 150px);
            line-height: 160px;
            pointer-events: none;
            top: 200px;
        }

        .primary-title h2 {
            font-size: inherit;
            line-height: inherit;
            margin: 0;
            white-space: nowrap;
            will-change: transform;
            color: #fff !important;
        }

        .title-part-one {
            transform: translateX(-5vw);
            margin-left: 120px !important;
        }

        .title-part-two {
            transform: translateX(12vw);
            margin-right: 200px !important;
        }

        /* ─── Video layer masked by the SVG logo ─── */
        #hero-video-mask {
            position: absolute;
            top: -80px;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;

            -webkit-mask-image: url("data:image/svg+xml,%3Csvg width='34' height='39' viewBox='0 0 34 39' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12.5156 1.61632L16.6891 0L33.3788 6.46739V16.1674L16.6891 9.70002L12.5156 11.3163V1.61632Z' fill='white'/%3E%3Cpath d='M20.8611 37.3841L16.6897 39.0004L0 32.5352V22.833L16.6897 29.3004L20.8611 27.6841V37.3841Z' fill='white'/%3E%3Cpath d='M0 17.8583L33.3794 30.7761V21.1803L0 8.26465V17.8583Z' fill='white'/%3E%3C/svg%3E");
            mask-image: url("data:image/svg+xml,%3Csvg width='34' height='39' viewBox='0 0 34 39' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12.5156 1.61632L16.6891 0L33.3788 6.46739V16.1674L16.6891 9.70002L12.5156 11.3163V1.61632Z' fill='white'/%3E%3Cpath d='M20.8611 37.3841L16.6897 39.0004L0 32.5352V22.833L16.6897 29.3004L20.8611 27.6841V37.3841Z' fill='white'/%3E%3Cpath d='M0 17.8583L33.3794 30.7761V21.1803L0 8.26465V17.8583Z' fill='white'/%3E%3C/svg%3E");

            -webkit-mask-position: center;
            mask-position: center;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: var(--mask-size);
            mask-size: var(--mask-size);
        }

        #hero-video-mask video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }

        #hero-video-overlay {
            position: absolute;
            inset: 0;
            background: #111;
            opacity: 0;
            pointer-events: none;
        }

        /* ─── Secondary content ─── */
        .secondary-title {
            position: absolute;
            z-index: 20;
            text-align: left;
            max-width: 800px;
            padding: 0 20px;
            opacity: 0;
            transform: translateY(50px);
        }

        .secondary-title h1 {
            font-size: clamp(5.8rem, 3.5vw, 3rem);
            margin-bottom: 20px;
            line-height: 1.1;
            color: #ffffff !important;
        }

        .secondary-title p {
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            line-height: 1.6;
            margin-bottom: 30px;
            color: #ccc;
        }

        /* Outlined CTA — dark fill, white hairline border, label + NE arrow */
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.75rem;
            width: 100%;
            max-width: 11rem;
            padding: 1.1rem 1.35rem 1.1rem 1.5rem;
            margin-top: 0.25rem;
            border: 1px solid #fff;
            border-radius: 0;
            background: rgba(8, 8, 8, 0.92);
            color: #fff;
            text-decoration: none;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            line-height: 1;
            transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
        }

        .button__label {
            flex: 0 0 auto;
        }

        .button__icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
        }

        .button__icon svg {
            display: block;
            width: 1.125rem;
            height: 1.125rem;
        }

        .button:hover {
            background: rgba(18, 18, 18, 0.98);
            border-color: rgba(255, 255, 255, 0.92);
        }

        .button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 3px;
        }

        /* ─── Mobile Responsiveness Additions ─── */
        @media (max-width: 768px) {
            .site-header {
                padding: 8px 16px;
            }

            .text-logo {
                max-width: min(42vw, 160px);
                align-items: flex-start;
            }

            .text-logo__simon {
                font-size: clamp(1.2rem, 0.85rem + 3.2vw, 1.75rem);
            }

            .text-logo__says {
                font-size: clamp(0.48rem, 0.38rem + 0.9vw, 0.58rem);
                letter-spacing: 0.18em;
            }

            .text-logo__rule {
                max-width: 1.6em;
            }

            .header-nav,
            .header-cta {
                display: none;
            }

            .header-menu-toggle {
                display: inline-flex;
            }

            .primary-title {
                top: 50%;
                transform: translateY(-50%);
                line-height: 1.1;
                width: 100%;
                align-items: center;
            }

            .title-part-one {
                margin-left: 0 !important;
                transform: translateX(0);
            }

            .title-part-two {
                margin-right: 0 !important;
                transform: translateX(0);
            }

            .secondary-title h1 {
                font-size: 2.5rem !important;
                /* Override inverted clamp issue */
            }
        }
    </style>
</head>

<body>

    <!-- ─── Hero Section ─── -->
    <section class="hero-section">

        <!-- Text sits behind the video mask -->
        <div class="primary-title" aria-label="Vision For Venture">
            <h2 class="title-part-one" aria-hidden="true">VISION</h2>
            <h2 class="title-part-two" aria-hidden="true">FOR VENTURE&reg;</h2>
        </div>

        <!-- Video masked to the logo shape — sits above text,
             so the logo window shows video playing over the type -->
        <div id="hero-video-mask">
            <video autoplay muted loop playsinline>
                <source src="https://simonsaysmindset.com/wp-content/uploads/2026/05/6470616-uhd_3840_2160_24fps.webm"
                    type="video/webm">
                <source src="https://simonsaysmindset.com/wp-content/uploads/2026/05/6470616-uhd_3840_2160_24fps.mp4"
                    type="video/mp4">
            </video>
            <div id="hero-video-overlay"></div>
        </div>

        <!-- Secondary content revealed after scroll -->
        <div class="secondary-title">
            <h1>A New Vision for Growth-Stage Startups in the Era of AI.</h1>
            <p>At Sightbox, we're delving into how generative artificial intelligence is reshaping the startup
                world, prompting us to develop a strategic response called "Promise Market Fit".</p>
            <a class="button"
                href="https://sightbox.co/blog/from-product-to-promise-a-new-vision-for-growth-stage-startups-in-the-era-of-ai/"
                target="_self" data-video-url="https://www.youtube.com/watch?v=7JAU7jrZwYY">
                <span class="button__label">Read more</span>
                <span class="button__icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 17 17 7" />
                        <path d="M17 7h-6M17 7v6" />
                    </svg>
                </span>
            </a>
        </div>

    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>

        gsap.registerPlugin(ScrollTrigger);  // ← must be first

        const isMobile = window.matchMedia("(max-width: 768px)").matches;

        // ─── Header reveal on scroll ───
        ScrollTrigger.create({
            trigger: ".hero-section",
            start: "top+=80 top",
            end: "+=2000",
            onEnter: () => document.getElementById('site-header').classList.add('is-visible'),
            onLeaveBack: () => document.getElementById('site-header').classList.remove('is-visible')
        });

        // ─── Hero scroll animation ───
        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".hero-section",
                start: "top top",
                end: "+=2000",
                scrub: 1,
                pin: true
            }
        });

        tl
            .to(".title-part-one", { x: "-100vw", ease: "power2.inOut" }, "start")
            .to(".title-part-two", { x: "100vw", ease: "power2.inOut" }, "start")

            .to("html", {
                "--mask-size": isMobile ? "2200px" : "6000px",  // ← single source of truth
                ease: "power2.inOut"
            }, "start")

            .to(".secondary-title", { opacity: 1, y: 0, ease: "power2.out" }, "+=0.2");
    </script>

</body>

</html>
